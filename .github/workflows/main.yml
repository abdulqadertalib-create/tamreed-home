name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          TAMREED_KEYSTORE_BASE64: ${{ secrets.TAMREED_KEYSTORE_BASE64 }}
        run: |
          test -n "$TAMREED_KEYSTORE_BASE64"
          printf '%s' "$TAMREED_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > android-app/tamreed-home-release.p12
          test -s android-app/tamreed-home-release.p12

      - name: Validate release keystore
        working-directory: android-app
        env:
          TAMREED_KEYSTORE_PASSWORD: ${{ secrets.TAMREED_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TAMREED_KEYSTORE_PASSWORD"
          openssl pkcs12 -in tamreed-home-release.p12 -noout -passin env:TAMREED_KEYSTORE_PASSWORD

      - name: Build debug APK and signed release AAB
        working-directory: android-app
        env:
          TAMREED_KEYSTORE_PATH: ${{ github.workspace }}/android-app/tamreed-home-release.p12
          TAMREED_KEYSTORE_PASSWORD: ${{ secrets.TAMREED_KEYSTORE_PASSWORD }}
          TAMREED_KEY_ALIAS: ${{ secrets.TAMREED_KEY_ALIAS }}
          TAMREED_KEY_PASSWORD: ${{ secrets.TAMREED_KEY_PASSWORD }}
        run: |
          test -n "$TAMREED_KEYSTORE_PASSWORD"
          test -n "$TAMREED_KEY_ALIAS"
          test -n "$TAMREED_KEY_PASSWORD"
          gradle clean lintDebug assembleDebug bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: tamreed-home-builds
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove release keystore
        if: always()
        run: rm -f android-app/tamreed-home-release.p12
